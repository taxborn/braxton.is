on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: debian
    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: build
        run: npm run build
      # TODO: deployment details to come; dist/ is the build output to ship
      - name: deploy
        run: echo "deploy step not yet implemented"
