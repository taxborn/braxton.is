on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: debian
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: build
        run: npm run build
      # TODO: deployment details to come; dist/ is the build output to ship
      - name: deploy
        run: echo "deploy step not yet implemented"
