on:
  push:
    branches:
      - main

concurrency:
  group: deploy

jobs:
  deploy:
    runs-on: debian
    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: build
        run: npm run build
      # The server bundle imports from node_modules at runtime, so a release
      # is client/, server/ and production-only dependencies together.
      - name: prune dev dependencies
        run: npm prune --omit=dev
      - name: package release
        run: tar -czf release.tgz -C dist client server -C "$PWD" node_modules
      # Carbon's sshd runs one forced command for this key (see
      # modules/nixos/services/braxton-is.nix in nixcfg). It reads the revision
      # from the command and the tarball from stdin, so nothing else is needed.
      - name: deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Carbon's host key, from keys/root_carbon.pub in nixcfg. Pinned so a
          # swapped host cannot receive the build.
          echo "100.64.2.0 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDqCVxnBi3Yv85dGjk37Uwx8EMogqGQlRS50JxhKysLV" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            braxton-deploy@100.64.2.0 "deploy $GITHUB_SHA" < release.tgz
